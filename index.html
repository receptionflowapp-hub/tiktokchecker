<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>profile_lookup.cpp</title>
<style>
  :root{--bg:#0a0c11;--box:#12161e;--box2:#171c26;--line:#262d3d;--fg:#e6ebf5;--mut:#9aa4bb;
    --cm:#6fae7c;--ty:#5ad1c0;--st:#f2a982;--nu:#b9dd9c;--kw:#d78be0;--er:#ff8b7a;--acc:#7c8cff;
    --fieldbg:#0c0f15;--glow:#1a2040;--hl:#171c34;--strong:#fff;--btn:#0a0c11}
  :root{--fm:ui-monospace,"JetBrains Mono","SF Mono",Consolas,Menlo,monospace;--fb:var(--fm);--fh:var(--fm)}
  [data-theme=noir]{--bg:#0b0a08;--box:#14120e;--box2:#1a1713;--line:#2e2820;--fg:#ece5d8;--mut:#aa9f8c;--cm:#c9a961;--ty:#d9bd7a;--st:#e8d3a2;--nu:#d9bd7a;--kw:#c9a961;--er:#d97a6c;--acc:#c9a961;--fieldbg:#0e0c09;--glow:#2a2111;--hl:#1d1810;--strong:#fff8ea;--btn:#14110b}
  [data-theme=ivory]{--bg:#f6f1e7;--box:#fffdf8;--box2:#f3ece0;--line:#e3d9c6;--fg:#2b2519;--mut:#857a66;--cm:#9a7b2e;--ty:#9a7b2e;--st:#7a5b1d;--nu:#6f6a2a;--kw:#9a7b2e;--er:#b5483a;--acc:#a8842f;--fieldbg:#f6f1e7;--glow:#efe3c6;--hl:#f7efdc;--strong:#1c170d;--btn:#fffdf8}
  [data-theme=red]{--bg:#0c0607;--box:#16090b;--box2:#1e0e11;--line:#3a1a1f;--fg:#f6e8e9;--mut:#b88b90;--cm:#ff6b6b;--ty:#ff5a5f;--st:#ffb3a0;--nu:#ffc9c9;--kw:#ff8fa3;--er:#ff9a9a;--acc:#e11d2e;--fieldbg:#090405;--glow:#4a0d14;--hl:#240b0f;--strong:#fff;--btn:#fff}
  :is([data-theme=noir],[data-theme=ivory]){--fb:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--fh:"Cormorant Garamond",Georgia,"Times New Roman",serif}
  [data-theme=light]{--bg:#f4f6fb;--box:#fff;--box2:#f0f2f8;--line:#dfe3ee;--fg:#1d2433;--mut:#6b7488;--cm:#2f8a4a;--ty:#0e8f80;--st:#c2562a;--nu:#3d7a1f;--kw:#a23fb0;--er:#d1432f;--acc:#4a5bff;--fieldbg:#f4f6fb;--glow:#e3e8ff;--hl:#eef0ff;--strong:#10131c;--btn:#fff}
  [data-theme=pink]{--bg:#1a0d16;--box:#241220;--box2:#2c1727;--line:#43243b;--fg:#fbe9f3;--mut:#c496b4;--cm:#ff8fc8;--ty:#ff6fb5;--st:#ffb38a;--nu:#ffd1e8;--kw:#d78bff;--er:#ff7a8a;--acc:#ff4fa3;--fieldbg:#170a13;--glow:#4a1636;--hl:#2e1428;--strong:#fff;--btn:#1a0d16}
  [data-theme=purple]{--bg:#0f0b1a;--box:#171127;--box2:#1d1630;--line:#31264d;--fg:#ece6ff;--mut:#9d90c4;--cm:#9ad18b;--ty:#7fd6ff;--st:#ffb38a;--nu:#c8e6a0;--kw:#e08bff;--er:#ff8b8b;--acc:#8b5cf6;--fieldbg:#0c0817;--glow:#2a1a55;--hl:#1c1636;--strong:#fff;--btn:#0f0b1a}
  [data-theme=green]{--bg:#050a06;--box:#0b130d;--box2:#101a12;--line:#1f3a25;--fg:#d6f5dc;--mut:#86b591;--cm:#4ade80;--ty:#4ade80;--st:#bef264;--nu:#86efac;--kw:#a3e635;--er:#fb7185;--acc:#22c55e;--fieldbg:#040805;--glow:#0f3a1a;--hl:#0d1f12;--strong:#eaffee;--btn:#04100a}
  [data-theme=blue]{--bg:#07101a;--box:#0d1826;--box2:#122033;--line:#1f3550;--fg:#e2efff;--mut:#7f9bbd;--cm:#6fd3b0;--ty:#5ac8fa;--st:#ffc38a;--nu:#a8e6a0;--kw:#b69cff;--er:#ff8b7a;--acc:#3b9cff;--fieldbg:#060d16;--glow:#0f3358;--hl:#102440;--strong:#fff;--btn:#06101a}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--fb)}
  body{background:radial-gradient(800px 420px at 10% -10%,var(--glow) 0,transparent 60%),var(--bg);
    padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(28px + env(safe-area-inset-bottom,0px))}
  .wrap{max-width:900px;margin:0 auto;display:grid;gap:14px}
  #out{display:grid;gap:14px}
  .box{background:var(--box);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
  .title{color:var(--cm);font-size:13px;margin:0 0 12px;font-weight:400}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:700px){.grid2{grid-template-columns:1fr}}
  h1{margin:0 0 4px;font-size:22px}h1 .kw{color:var(--kw)}h1 .ty{color:var(--ty)}
  .sub{color:var(--mut);font-size:13px;margin-bottom:14px}
  form{display:grid;gap:10px}
  .inputs{display:flex;gap:10px;flex-wrap:wrap}
  .field{flex:1;min-width:180px;display:flex;align-items:center;background:var(--fieldbg);border:1px solid var(--line);border-radius:10px;padding:0 12px}
  .field:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px #7c8cff33}
  .field span{color:var(--mut)}
  .field input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--st);font:inherit;font-size:16px;padding:12px 6px}
  #f2{display:none}#f2.on{display:flex}
  .btns{display:flex;gap:10px;flex-wrap:wrap}
  button{background:var(--acc);color:var(--btn);border:0;border-radius:10px;padding:0 20px;min-height:44px;font:inherit;font-weight:700;cursor:pointer}
  button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
  button:hover{filter:brightness(1.12)}button:disabled{opacity:.5;cursor:wait}
  button:focus-visible{outline:2px solid #fff;outline-offset:2px}
  .prof{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .av{width:96px;height:96px;border-radius:50%;object-fit:cover;border:2px solid var(--line);background:var(--box2)}
  .who{flex:1;min-width:200px}.who h2{margin:0;font-size:22px}.at{color:var(--mut)}
  .bio{margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .chip{font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
  .chip.y{color:var(--ty);border-color:var(--acc);background:transparent}
  .hl{border-color:var(--acc);background:linear-gradient(180deg,var(--hl),var(--box))}
  .big{font-size:21px;color:var(--strong);line-height:1.35;overflow-wrap:anywhere}
  .live{font-size:26px;color:var(--ty);margin:8px 0 2px;font-weight:700;overflow-wrap:anywhere}
  .sm{color:var(--mut);font-size:13px}
  .line{margin-top:8px}
  .tag{display:inline-block;margin-top:10px;font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--acc);color:var(--acc)}
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
  .t{background:var(--box);border:1px solid var(--line);border-radius:12px;padding:12px}
  .t b{display:block;font-size:18px;color:var(--nu)}.t span{display:block;line-height:1.35;font-size:12px;color:var(--mut)}
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  @media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.stat:last-child{grid-column:1/-1}}
  .stat{background:var(--box);border:1px solid var(--line);border-radius:14px;padding:14px}
  .stat b{display:block;font-size:24px;line-height:1.2}.stat span{color:var(--mut);font-size:13px}
  .stat i{display:block;font-style:normal;color:var(--nu);font-size:12px}
  .row{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:0;padding-top:0}
  .k{color:var(--mut);flex:0 0 auto}.v{text-align:right;overflow-wrap:anywhere;min-width:0}
  .v.copy{cursor:pointer}.s{color:var(--st)}.no{color:var(--er)}.yes{color:var(--ty)}.dim{color:var(--mut)}
  .dates,.avs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:700px){.dates{grid-template-columns:1fr}}
  .d,.a{background:var(--box2);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
  .d h4{margin:0 0 8px;font-size:14px;color:var(--ty)}
  .d .row{font-size:13px;padding:6px 0;flex-direction:column;gap:0}.d .v{text-align:left}
  .a{text-align:center;padding:10px}.a img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--fieldbg)}
  .a span{display:block;margin-top:6px;font-size:12px;color:var(--mut)}
  .ab .r{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
  .ab .r:first-of-type{border-top:0;padding-top:0}
  .ab .ic{font-size:20px;width:28px;text-align:center}.ab .lb{color:var(--mut);font-size:13px}.ab .vl{font-size:17px;color:var(--strong);overflow-wrap:anywhere}
  .nt{color:var(--mut);font-size:12px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .cmp{display:grid;grid-template-columns:1fr 1fr 1fr;font-size:14px}
  .cmp>div{padding:10px 8px;border-top:1px solid var(--line);overflow-wrap:anywhere;min-width:0}
  .cmp .h{border-top:0;text-align:center}.cmp .h img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--line)}
  .cmp .l{color:var(--mut)}.cmp .c{text-align:center}.cmp .w{color:var(--nu);font-weight:700}
  .note{border-color:#f2a98255;background:#f2a98210;color:var(--st);font-size:13px}
  .err{border-color:#ff8b7a55;background:#ff8b7a10;color:var(--er)}
  .empty{color:var(--mut);text-align:center;padding:28px 16px}
  .foot{color:var(--mut);font-size:12px;text-align:center}
  .cur{display:inline-block;width:8px;height:15px;background:var(--fg);vertical-align:-2px;animation:b 1s steps(1) infinite}
  @keyframes b{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.cur{animation:none}}
  .top{display:flex;align-items:center;gap:12px}.top b{color:var(--cm);font-weight:400}
  #drawer{position:fixed;top:0;left:0;bottom:0;width:250px;max-width:80vw;background:var(--box);border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .2s;z-index:20;padding:calc(18px + env(safe-area-inset-top,0px)) 14px 14px;display:flex;flex-direction:column;gap:8px}
  #drawer.on{transform:none}
  #drawer h3{margin:0 0 8px;color:var(--cm);font-size:13px;font-weight:400}
  #scrim{position:fixed;inset:0;background:#0009;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}#scrim.on{opacity:1;pointer-events:auto}
  .nav{background:transparent;color:var(--fg);border:1px solid transparent;text-align:left;font-weight:400;min-height:46px}
  .nav.on{background:var(--box2);border-color:var(--line);color:var(--acc);font-weight:700}
  .page{display:none;gap:14px}.page.on{display:grid}
  .hrow{cursor:pointer}.hrow:hover .k{color:var(--acc)}
  .themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .th{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--box2);color:var(--fg);border:2px solid var(--line);border-radius:12px;padding:12px 6px;font-weight:400;min-height:0}
  .th.on{border-color:var(--acc)}.th i{width:34px;height:34px;border-radius:50%;border:2px solid var(--line)}
  details summary{cursor:pointer;color:var(--cm)}
  @media(prefers-reduced-motion:reduce){#drawer,#scrim{transition:none}}
  h1,h2,.big,.live,.stat b,.t b,.ab .vl{font-family:var(--fh)}
  .title,.sub,.foot,.top b,#drawer h3{font-family:var(--fm)}
  :is([data-theme=noir],[data-theme=ivory]) :is(.big,h1){font-size:27px;font-weight:600;letter-spacing:.01em}
  :is([data-theme=noir],[data-theme=ivory]) .who h2{font-size:32px;font-weight:600}
  :is([data-theme=noir],[data-theme=ivory]) .live{font-size:34px;font-weight:600}
  :is([data-theme=noir],[data-theme=ivory]) :is(.stat b,.t b){font-size:28px;font-weight:600}
  :is([data-theme=noir],[data-theme=ivory]) .box{border-radius:18px;box-shadow:0 18px 50px -28px #000}
  :is([data-theme=noir],[data-theme=ivory]) .av{border-color:var(--acc);box-shadow:0 0 0 4px #c9a96122}
  [data-theme=noir] .live{background:linear-gradient(90deg,var(--acc),#fff3d0,var(--acc));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 7s linear infinite}
  @keyframes sh{to{background-position:200% 0}}
  :is([data-theme=noir],[data-theme=ivory]) #out>*{animation:fi .6s ease both}
  @keyframes fi{from{opacity:0;transform:translateY(8px)}}
  @media(prefers-reduced-motion:reduce){[data-theme=noir] .live,:is([data-theme=noir],[data-theme=ivory]) #out>*{animation:none}}
  .lead{margin:0 0 14px;font-family:var(--fb);font-size:15px;color:var(--mut)}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  [data-calm="1"] *{animation:none!important;transition:none!important}
  .sbtn{min-height:34px;padding:0 12px;font-size:13px}
  .tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line)}
  .tl li{position:relative;padding:0 0 14px 14px}.tl li::before{content:"";position:absolute;left:-25px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--line)}
  .tl li.on::before{background:var(--acc)}.tl b{display:block;color:var(--strong);font-weight:600}.tl span{color:var(--mut);font-size:13px}
  .rep h2{margin:0 0 4px}.rep h4{margin:16px 0 6px;color:var(--cm);font-family:var(--fm);font-size:13px;font-weight:400}
  @media print{
    .top,#drawer,#scrim,.foot,.page:not(#pg-reports),.btnsrep{display:none!important}
    body{background:#fff!important;padding:0}#pg-reports{display:block!important}
    #reportArea,#reportArea *{color:#000!important;background:#fff!important;border-color:#ccc!important}
  }
  .bigsave{width:100%;min-height:54px;font-size:17px;margin-bottom:10px;border-radius:12px}
  .bigsave:disabled{opacity:.6;cursor:default}
</style>

<body>
<div id="scrim"></div>
<nav id="drawer" aria-label="Main menu" inert><h3>// menu</h3>
  <button class="nav on" data-tab="lookup">🔎 Lookup</button>
  <button class="nav" data-tab="history">🕘 History</button>
  <button class="nav" data-tab="favs">⭐ Favourites</button>
  <button class="nav" data-tab="reports">📄 Reports</button>
  <button class="nav" data-tab="tools">🧰 Tools</button>
  <button class="nav" data-tab="settings">⚙️ Settings</button>
</nav>
<div class="wrap">
  <header class="top"><button id="menuBtn" type="button" class="ghost" aria-label="open menu" aria-expanded="false" aria-controls="drawer">☰ menu</button><b id="pageName">// lookup</b></header>
  <main id="main">
  <section id="pg-lookup" class="page on">
  <div class="box">
    <h1>See what TikTok publicly shows about any profile</h1>
    <p class="lead">Check account age, public stats, profile flags, timestamps and more. No login needed.</p>
    <form id="f">
      <div class="inputs">
        <label class="field" for="u"><span>@</span><input id="u" placeholder="username" aria-label="username" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="24" autofocus></label>
        <label class="field" id="f2" for="v"><span>@</span><input id="v" placeholder="second username" aria-label="second username" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="24"></label>
      </div>
      <div class="btns"><button id="go" type="submit">run lookup</button><button id="cmpBtn" type="button" class="ghost">+ compare</button></div>
    </form>
  </div>
  <div id="out" aria-live="polite"><div class="box empty">// enter a username above and hit run lookup</div></div>
  <div class="foot">// shows only what TikTok publicly returns. "not exposed" = no value returned.</div>
  </section>
  <section id="pg-history" class="page"></section>
  <section id="pg-favs" class="page"></section>
  <section id="pg-tools" class="page"></section>
  <section id="pg-reports" class="page"></section>
  <section id="pg-settings" class="page"></section>
  </main>
</div>

<script>
const $=(id)=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch{return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}};
const THEMES=[["dark","Dark","#0a0c11","#7c8cff"],["light","Light","#f4f6fb","#4a5bff"],["pink","Pink","#1a0d16","#ff4fa3"],["purple","Purple","#0f0b1a","#8b5cf6"],["green","Hacker","#050a06","#22c55e"],["blue","Ocean","#07101a","#3b9cff"],["noir","Noir & Gold","#0b0a08","#c9a961"],["ivory","Ivory & Gold","#f6f1e7","#a8842f"],["red","Red & Black","#0c0607","#e11d2e"]];
function applyTheme(t){document.documentElement.dataset.theme=t;store.set("theme",t);}
applyTheme(store.get("theme","dark"));
document.documentElement.dataset.calm=store.get("calm",false)?"1":"0";
const esc=(v)=>String(v==null?"":v).replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(n)=>n==null?"0":Intl.NumberFormat("en",{notation:"compact",maximumFractionDigits:1}).format(n);
const box=(t,b,c)=>'<div class="box '+(c||"")+'">'+(t?'<h3 class="title">// '+t+'</h3>':"")+b+"</div>";
const val=(v)=>v==null||v===""?'<span class="dim">not exposed</span>':'<span class="s">'+esc(v)+"</span>";
const row=(k,v,cp)=>'<div class="row"><span class="k">'+k+'</span><span class="v'+(cp?' copy" data-c="'+esc(v):"")+'">'+val(v)+"</span></div>";
const flag=(k,v)=>'<div class="row"><span class="k">'+k+'</span><span class="v '+(v?"yes":"no")+'">'+!!v+"</span></div>";
const dstr=(s)=>{const d=new Date(s*1000),m=store.get("df","long");return m==="iso"?d.toISOString().slice(0,10):m==="us"?d.toLocaleDateString("en-US"):d.toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"});};

function ago(sec){
  const s=Math.max(0,Date.now()/1000-sec),d=Math.floor(s/86400);
  if(s<3600)return Math.max(1,Math.floor(s/60))+" minutes ago";
  if(s<86400)return Math.floor(s/3600)+" hours ago";
  if(d<60)return d+" days ago";
  if(d<730)return Math.floor(d/30.44)+" months ago";
  return (d/365.25).toFixed(1)+" years ago";
}
function era(sec){
  const y=new Date(sec*1000);
  if(y<new Date("2018-08-02"))return "Older than the Musical.ly to TikTok switch";
  if(y<new Date("2020-03-01"))return "Early TikTok era";
  if(y<new Date("2022-01-01"))return "Lockdown-era account";
  if(y<new Date("2024-01-01"))return "Peak TikTok era";
  return "Recent account";
}
function birthday(sec){
  const c=new Date(sec*1000),n=new Date(),today=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  let next=new Date(n.getFullYear(),c.getMonth(),c.getDate());
  if(next<today)next=new Date(n.getFullYear()+1,c.getMonth(),c.getDate());
  const days=Math.round((next-today)/864e5),turns=next.getFullYear()-c.getFullYear();
  if(days===0)return "🎂 Account birthday is TODAY. It turns "+turns+"!";
  return "🎂 Turns "+turns+" in "+days+" day"+(days===1?"":"s")+" ("+next.toLocaleDateString(undefined,{day:"numeric",month:"long"})+")";
}
function funLine(sec){
  const days=(Date.now()/1000-sec)/86400,km=Math.round(days*2.575e6/1e5)/10;
  return "🌍 Since joining, Earth has travelled about "+km+" million km around the Sun. In Unix time they joined at second "+sec.toLocaleString()+".";
}
function country(rc){
  if(!rc||!/^[A-Za-z]{2}$/.test(rc))return null;
  const up=rc.toUpperCase();let name=up;
  try{name=new Intl.DisplayNames(["en"],{type:"region"}).of(up)||up;}catch{}
  return String.fromCodePoint(...[...up].map((x)=>127397+x.charCodeAt(0)))+" "+name;
}
function langName(c){try{return c?new Intl.DisplayNames(["en"],{type:"language"}).of(c):null;}catch{return c;}}

function tick(){
  document.querySelectorAll("[data-live]").forEach((el)=>{
    let s=Math.max(0,Math.floor(Date.now()/1000-el.dataset.live));
    const d=Math.floor(s/86400);s%=86400;const h=Math.floor(s/3600);s%=3600;
    el.textContent=d.toLocaleString()+"d "+h+"h "+Math.floor(s/60)+"m "+(s%60)+"s";
  });
}
setInterval(tick,1000);

function highlights(d){
  const c=d.dates.created&&d.dates.created.epochSeconds,s=d.stats;
  if(!c)return "";
  const dt=new Date(c*1000),days=Math.floor((Date.now()-dt)/864e5),months=Math.max(1,days/30.44);
  const yrs=Math.floor(days/365.25),mos=Math.floor((days-yrs*365.25)/30.44);
  const when=dt.toLocaleString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric",hour:"numeric",minute:"2-digit"});
  const tile=(v,l)=>'<div class="t"><b>'+esc(v)+"</b><span>"+l+"</span></div>";
  const nm=d.dates.nicknameModified,um=d.dates.usernameModified;
  let t=tile(nm&&nm.epochSeconds?ago(nm.epochSeconds):"not exposed","last nickname change")+tile(um&&um.epochSeconds?ago(um.epochSeconds):"never changed","last username change");
  if(s.following>0&&s.friends!=null)t+=tile(Math.round(s.friends/s.following*100)+"%","of who they follow follows back");
  if(s.followers>0&&s.likes!=null)t+=tile((s.likes/s.followers).toFixed(1),"likes per follower");
  if(s.videos>0)t+=tile((s.videos/months).toFixed(1),"videos per month (estimate)");
  if(s.videos>0&&s.likes!=null)t+=tile(fmt(Math.round(s.likes/s.videos)),"likes per video");
  return box("highlights",'<div class="big">Joined '+esc(when)+'</div><div class="sm">your local time &middot; account is '+yrs+" yr "+mos+' mo old</div>'+
    '<div class="live" data-live="'+c+'"></div><div class="sm">live account age</div>'+
    '<div class="line">'+birthday(c)+'</div><div class="line sm">'+funLine(c)+'</div><span class="tag">'+esc(era(c))+"</span>"+'<div class="tiles">'+t+"</div>","hl");
}

function about(d){
  const p=d.profile,c=d.dates.created,u=d.dates.usernameModified;
  const r=(ic,lb,vl)=>'<div class="r"><div class="ic">'+ic+'</div><div><div class="lb">'+lb+'</div><div class="vl">'+vl+"</div></div></div>";
  const nx='<span class="dim">not exposed</span>';
  return box("about this account",'<div class="ab">'+r("📅","Date joined",c&&c.epochSeconds?esc(dstr(c.epochSeconds)):nx)+
    r("📍","Account based in",country(p.region)?esc(country(p.region)):nx)+
    r("✏️","Username changes",u&&u.epochSeconds?"Last changed "+esc(dstr(u.epochSeconds))+" ("+ago(u.epochSeconds)+")":"No change recorded")+
    '<div class="nt">Region is what TikTok reports for the account. It may not be where it was created, and can be missing. TikTok has no username change count or sign-up method like X.</div></div>',"ab");
}

function dateBox(n,d){
  if(!d||!d.epochSeconds)return '<div class="d"><h4>'+n+'</h4><div class="row"><span class="v dim">not exposed</span></div></div>';
  const t=new Date(d.epochSeconds*1000),r=(k,v)=>'<div class="row"><span class="k">'+k+'</span><span class="v">'+esc(v)+"</span></div>";
  return '<div class="d"><h4>'+n+"</h4>"+r("local",t.toLocaleString())+r("utc",t.toUTCString())+r("epoch",d.epochSeconds)+r("iso",d.iso)+"</div>";
}

function timeline(d){
  const ev=[["Account created",d.dates.created],["Nickname modified",d.dates.nicknameModified],["Username modified",d.dates.usernameModified]];
  const ok=(e)=>e[1]&&e[1].epochSeconds,known=ev.filter(ok).sort((a,b)=>a[1].epochSeconds-b[1].epochSeconds),miss=ev.filter((e)=>!ok(e));
  const item=(l,t,on)=>'<li class="'+(on?"on":"")+'"><b>'+esc(t)+"</b><span>"+l+"</span></li>";
  return box("timeline",'<ol class="tl">'+known.map((e)=>item(e[0],dstr(e[1].epochSeconds),1)).join("")+miss.map((e)=>item(e[0],"Not exposed",0)).join("")+'</ol><div class="nt">Only the dates TikTok publicly exposes. TikTok does not provide a full username history.</div>');
}
function snapOf(d){const s=d.stats,p=d.profile;return{t:Date.now(),followers:s.followers,following:s.following,likes:s.likes,videos:s.videos,friends:s.friends,nickname:p.nickname,verified:!!p.verified,priv:!!p.privateAccount,avatar:((p.avatars&&p.avatars.large)||p.avatar||"").split("?")[0]};}
function diffSnap(a,b){
  const out=[],num=(k)=>{const x=(b[k]||0)-(a[k]||0);if(x)out.push((x>0?"+":"")+fmt(x)+" "+k);};
  ["followers","following","likes","videos","friends"].forEach(num);
  if(a.nickname!==b.nickname)out.push("nickname: "+(a.nickname||"-")+" → "+(b.nickname||"-"));
  if(a.verified!==b.verified)out.push(b.verified?"became verified":"no longer verified");
  if(a.priv!==b.priv)out.push(b.priv?"became private":"became public");
  if(a.avatar&&b.avatar&&a.avatar!==b.avatar)out.push("profile picture changed");
  return out;
}
const getSnaps=(k)=>{const v=store.get("snaps",{})[k];return Array.isArray(v)?v:(v?[v]:[]);};
function saveSnap(d){const all=store.get("snaps",{}),k=d.profile.username.toLowerCase(),a=getSnaps(k);a.push(snapOf(d));all[k]=a.slice(-10);store.set("snaps",all);return a.length;}
function changes(d,demo){
  const k=d.profile.username.toLowerCase(),a=getSnaps(k),prev=a[a.length-1];
  const btn=demo?'<button type="button" class="bigsave" disabled>💾 Save snapshot</button><div class="sm">Demo data is never saved. Snapshots work on your live site.</div>'
    :'<button type="button" id="snapBtn" class="bigsave">💾 Save snapshot</button>';
  const note='<div class="nt" id="snapNote">Snapshots are saved only on this device and compared between your own checks. It is not a complete history.</div>';
  if(demo)return box("snapshot",btn+note);
  if(!prev)return box("snapshot",btn+'<div class="sm" id="snapSt">No snapshot of @'+esc(d.profile.username)+" saved yet. Save one now, then check again later to see what changed.</div>"+note);
  const df=diffSnap(prev,snapOf(d));
  return box("snapshot",btn+'<div class="sm" id="snapSt">Compared with your snapshot from '+esc(new Date(prev.t).toLocaleString())+" ("+a.length+" saved)</div>"+
    (df.length?df.map((x)=>'<div class="row"><span class="v" style="text-align:left">'+esc(x)+"</span></div>").join(""):'<div class="sm" style="margin-top:6px">No changes in the public data since that snapshot.</div>')+note);
}

  h+=box("dates",'<div class="dates">'+dateBox("created",d.dates.created)+dateBox("nicknameModified",d.dates.nicknameModified)+dateBox("usernameModified",d.dates.usernameModified)+"</div>");

function renderCompare(A,B){
  const ep=(d)=>d.dates.created&&d.dates.created.epochSeconds||0;
  const metrics=[["Joined",(d)=>ep(d)?dstr(ep(d)):"not exposed",(d)=>ep(d)||null,true],
    ["Followers",(d)=>fmt(d.stats.followers),(d)=>d.stats.followers,false],["Following",(d)=>fmt(d.stats.following),(d)=>d.stats.following,false],
    ["Likes",(d)=>fmt(d.stats.likes),(d)=>d.stats.likes,false],["Videos",(d)=>fmt(d.stats.videos),(d)=>d.stats.videos,false],
    ["Friends",(d)=>fmt(d.stats.friends),(d)=>d.stats.friends,false],["Region",(d)=>country(d.profile.region)||"not exposed",()=>null,false]];
  const head=(d)=>'<div class="h">'+((d.profile.avatars&&d.profile.avatars.large)||d.profile.avatar?'<img src="'+esc((d.profile.avatars&&d.profile.avatars.large)||d.profile.avatar)+'" alt="" referrerpolicy="no-referrer">':"")+"<div>"+esc(d.profile.nickname||d.profile.username)+'</div><div class="sm">@'+esc(d.profile.username)+"</div></div>";
  let g='<div class="cmp"><div class="h"></div>'+head(A)+head(B);
  metrics.forEach((m)=>{
    const a=m[2](A),b=m[2](B);let wa="",wb="";
    if(a!=null&&b!=null&&a!==b){const aw=m[3]?a<b:a>b;wa=aw?" w":"";wb=aw?"":" w";}
    g+='<div class="l">'+m[0]+'</div><div class="c'+wa+'">'+esc(m[1](A))+'</div><div class="c'+wb+'">'+esc(m[1](B))+"</div>";
  });
  g+="</div>";
  let sum="";const ea=ep(A),eb=ep(B);
  if(ea&&eb){const gap=Math.round(Math.abs(ea-eb)/86400),first=ea<eb?A:B,second=ea<eb?B:A;
    sum+="@"+esc(first.profile.username)+" joined "+gap.toLocaleString()+" days before @"+esc(second.profile.username)+".";}
  const fa=A.stats.followers,fb=B.stats.followers;
  if(fa&&fb&&fa!==fb){const hi=fa>fb?A:B,lo=fa>fb?B:A;sum+=" @"+esc(hi.profile.username)+" has "+(Math.max(fa,fb)/Math.min(fa,fb)).toFixed(1)+"x more followers than @"+esc(lo.profile.username)+".";}
  return box("compare",g+(sum?'<div class="nt">'+sum+"</div>":""));
}

class NetErr extends Error{}
async function getProfile(n){
  let r;
  try{r=await fetch("/api/profile?username="+encodeURIComponent(n));}catch{throw new NetErr("no server");}
  let j;try{j=await r.json();}catch{throw new NetErr("no api");}
  if(r.status===402){const e=new Error(j.error);e.premium=n;throw e;}
  if(!r.ok)throw new Error(j.error||"request failed");
  return j;
}

const valid=(n)=>/^[A-Za-z0-9._]{1,24}$/.test(n);
const clean=(n)=>(n||"").trim().replace(/^@/,"");
const fail=(m)=>{$("out").innerHTML=box("error","throw std::runtime_error(&quot;"+esc(m)+"&quot;);","err");};
let lastText="",lastLink="";

function copy(text,btn){
  const done=()=>{if(btn){const o=btn.textContent;btn.textContent="copied!";setTimeout(()=>btn.textContent=o,1500);}};
  if(navigator.clipboard)navigator.clipboard.writeText(text).then(done,()=>prompt("Copy this:",text));else prompt("Copy this:",text);
}

function summary(d){
  const p=d.profile,s=d.stats,c=d.dates.created&&d.dates.created.epochSeconds;
  return "@"+p.username+" ("+(p.nickname||"")+")\n"+(c?"Joined: "+new Date(c*1000).toLocaleString()+"\n":"")+
    "Region: "+(country(p.region)||"not exposed")+"\nFollowers: "+s.followers+" | Following: "+s.following+" | Likes: "+s.likes+" | Videos: "+s.videos;
}

const LOCKED=["_ik1xx"];
function premiumBox(name){
  return box("access denied",'<div style="text-align:center;padding:18px 8px"><div style="font-size:42px">🔒</div>'+
    '<div class="big" style="margin:8px 0">Sorry, @'+esc(name)+' is premium only.</div>'+
    '<div class="sm" style="margin-bottom:16px">Pay <b style="color:var(--strong)">£1,000,000</b> to see this user.</div>'+
    '<button id="payBtn" type="button">pay £1,000,000</button><div id="payMsg" class="sm" style="margin-top:12px"></div></div>',"err");
}
async function run(u,v){
  const lk=[u,v].find((n)=>n&&LOCKED.includes(n.toLowerCase()));
  if(lk){
    $("out").innerHTML=premiumBox(lk);
    $("payBtn").onclick=()=>{$("payMsg").textContent="payment declined: insufficient funds 💀";};
    return;
  }
  $("go").disabled=true;
  $("out").innerHTML=box("",'// fetching... <span class="cur"></span>',"empty");
  let demo=false,A,B;
  try{
    if(v)[A,B]=await Promise.all([getProfile(u),getProfile(v)]);else A=await getProfile(u);
  }catch(e){
    if(e.premium){$("go").disabled=false;$("out").innerHTML=premiumBox(e.premium);$("payBtn").onclick=()=>{$("payMsg").textContent="payment declined: insufficient funds 💀";};return;}
    if(e instanceof NetErr){demo=true;A=DEMO;B=DEMO2;}else{$("go").disabled=false;return fail(e.message);}
  }
  let h=demo?box("","DEMO MODE: no backend connected, showing sample data. Run server.js for real lookups.","note"):"";
  h+=v?renderCompare(A,B):renderOne(A,changes(A,demo));
  if(!v)window.LAST={d:A,t:Date.now(),demo};
  const base=location.origin!=="null"?location.origin+location.pathname:location.pathname;
  lastLink=base+"?u="+encodeURIComponent(u)+(v?"&v="+encodeURIComponent(v):"");
  lastText=v?summary(A)+"\n\n"+summary(B):summary(A);
  h+='<div class="box"><div class="btns"><button id="shareBtn" type="button">copy share link</button><button id="sumBtn" type="button" class="ghost">copy summary</button>'+(v?"":'<button id="favBtn" type="button" class="ghost"></button>')+'</div></div>';
  $("out").innerHTML=h;
  $("shareBtn").onclick=(e)=>copy(lastLink,e.target);
  $("sumBtn").onclick=(e)=>copy(lastText,e.target);
  if($("snapBtn"))$("snapBtn").onclick=(e)=>{const n=saveSnap(A);e.target.textContent="✓ snapshot saved";e.target.disabled=true;$("snapSt").textContent="Saved "+new Date().toLocaleString()+" ("+n+" saved). Check this account again later to see what changed.";};
  if($("favBtn")){const has=()=>getFavs().some((x)=>x.u.toLowerCase()===u.toLowerCase());
    const lab=()=>{$("favBtn").textContent=has()?"★ favourited":"☆ favourite";$("favBtn").setAttribute("aria-pressed",has());};lab();
    $("favBtn").onclick=()=>{let f=getFavs();f=has()?f.filter((x)=>x.u.toLowerCase()!==u.toLowerCase()):[{u,label:"",checked:Date.now()},...f];setFavs(f);lab();};}
  try{history.replaceState(null,"","?u="+encodeURIComponent(u)+(v?"&v="+encodeURIComponent(v):""));}catch{}
  tick();$("go").disabled=false;addHistory(u,v);
}

async function refreshAll(){
  const fs=getFavs();$("refAll").disabled=true;
  for(const x of fs){
    try{const d=await getProfile(x.u),a=getSnaps(x.u.toLowerCase()),prev=a[a.length-1],cur=snapOf(d);
      x.checked=Date.now();const df=prev?diffSnap(prev,cur):[];x.note=prev?(df.length?df.join(", "):"no change since snapshot"):"no snapshot saved";}
    catch(e){x.note=e instanceof NetErr?"needs the live server":(e.message||"failed");if(e instanceof NetErr)break;}
  }
  setFavs(fs);renderFavs();
}

  $("pg-reports").innerHTML='<div class="box rep" id="reportArea"><h2>Public profile report: @'+esc(u)+'</h2><div class="sm">Looked up '+esc(when)+" · Source: "+esc(src)+"</div>"+
    (L.demo?'<div class="nt" style="color:var(--st)">DEMO DATA, not a real lookup.</div>':"")+sec+"<h4>Not available</h4><div>"+(miss.length?esc(miss.join(", ")):"nothing missing")+'</div><div class="nt">Only public data TikTok returned at the time of lookup.</div></div>'+
    '<div class="box btnsrep"><div class="btns"><button id="rCopy" type="button">copy report</button><button id="rJson" type="button" class="ghost">download JSON</button><button id="rCsv" type="button" class="ghost">download CSV</button><button id="rPrint" type="button" class="ghost">print</button><button id="rLink" type="button" class="ghost">copy share link</button></div></div>';
  const text=()=>"PUBLIC PROFILE REPORT: @"+u+"\nLooked up: "+when+"\nSource: "+src+(L.demo?"\nDEMO DATA":"")+"\n\n"+reportData(L).map((s)=>s[0].toUpperCase()+"\n"+s[1].map((r)=>"  "+r[0]+": "+(r[1]==null||r[1]===""?"not exposed":r[1])).join("\n")).join("\n\n")+"\n\nNot available: "+(miss.join(", ")||"nothing missing");
  $("rCopy").onclick=(e)=>copy(text(),e.target);
  $("rJson").onclick=()=>dlFile("report-"+u+".json",JSON.stringify({lookedUpAt:new Date(L.t).toISOString(),source:src,demo:!!L.demo,notAvailable:miss,data:L.d},null,2),"application/json");
  $("rCsv").onclick=()=>dlFile("report-"+u+".csv","section,field,value\n"+reportData(L).flatMap((s)=>s[1].map((r)=>[s[0],r[0],r[1]].map(q).join(","))).join("\n")+"\n"+["meta","looked_up",new Date(L.t).toISOString()].map(q).join(",")+"\n"+["meta","source",src].map(q).join(","),"text/csv");
  $("rPrint").onclick=()=>window.print();
  $("rLink").onclick=(e)=>copy(location.origin!=="null"?location.origin+location.pathname+"?u="+encodeURIComponent(u):lastLink,e.target);
}
const GLOSS=[["createTime","when the account was created (unix seconds)"],["nickNameModifyTime","last time the display name changed"],["uniqueIdModifyTime","last time the @username changed"],["region","country code TikTok reports. May differ from where the account was made"],["secUid","long internal id used in some TikTok links"],["privateAccount","whether the account is set to private"],["verified","whether the account has a verified badge"],["friends","accounts that follow each other"],["likes (heart)","total likes received across all videos"],["profileTab","which tabs the profile shows"]];
function renderTools(){
  const fld=(id,ph,ml)=>'<label class="field" for="'+id+'"><input id="'+id+'" placeholder="'+ph+'" autocomplete="off" autocapitalize="off" spellcheck="false"'+(ml?' maxlength="'+ml+'"':"")+"></label>";
  const out=(id,t)=>'<div id="'+id+'" class="nt" style="border:0">'+t+"</div>";
  $("pg-tools").innerHTML=box("timestamp converter",fld("tsIn","unix seconds or a date")+'<div class="btns" style="margin-top:10px"><button id="tsNow" type="button" class="ghost">use now</button></div>'+out("tsOut","paste a unix timestamp like 1592775099, or a date like 2020-06-21."))+
    box("username cleaner and profile link parser",fld("clIn","paste a TikTok link or a messy @name")+out("clOut","paste a link or name."))+
    box("json viewer",'<textarea id="jsIn" rows="4" aria-label="JSON to format" placeholder="paste JSON here" style="width:100%;background:var(--fieldbg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font:13px/1.5 var(--fm)"></textarea><pre id="jsOut" class="nt" style="border:0;white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--fm)"></pre>')+
    box("region code",fld("rgIn","two letter code, e.g. GB",2)+out("rgOut","TikTok reports region as a two letter country code."))+
    box("field glossary",GLOSS.map((g)=>'<div class="row"><span class="k">'+g[0]+'</span><span class="v dim">'+esc(g[1])+"</span></div>").join(""));
  const ts=()=>{
    const v=$("tsIn").value.trim();if(!v){$("tsOut").textContent="paste a unix timestamp like 1592775099, or a date like 2020-06-21.";return;}
    const ms=/^\d+$/.test(v)?(v.length>=12?+v:+v*1000):Date.parse(v);
    if(isNaN(ms)||isNaN(new Date(ms).getTime())){$("tsOut").textContent="not a valid timestamp or date.";return;}
    const d=new Date(ms),r=(k,x)=>'<div class="row"><span class="k">'+k+'</span><span class="v">'+esc(x)+"</span></div>";
    $("tsOut").innerHTML=r("local",d.toLocaleString())+r("utc",d.toUTCString())+r("iso",d.toISOString())+r("epoch",Math.floor(ms/1000))+r("relative",ago(ms/1000));
  };
  $("tsIn").oninput=ts;$("tsNow").onclick=()=>{$("tsIn").value=Math.floor(Date.now()/1000);ts();};
  $("clIn").oninput=()=>{
    const v=$("clIn").value.trim(),m=v.match(/tiktok\.com\/@([A-Za-z0-9._]{1,24})/i),name=(m?m[1]:v.replace(/^@/,"").replace(/[^A-Za-z0-9._]/g,"")).slice(0,24);
    $("clOut").innerHTML=!v?"paste a link or name.":name?'cleaned: <b>@'+esc(name)+"</b><br>link: https://www.tiktok.com/@"+esc(name)+'<br><button type="button" id="clGo" class="ghost sbtn" style="margin-top:8px">look it up</button>':"nothing usable found.";
    if($("clGo"))$("clGo").onclick=()=>{showTab("lookup");setCompare(false);$("u").value=name;run(name,"");};
  };
  $("jsIn").oninput=()=>{const v=$("jsIn").value.trim();if(!v){$("jsOut").textContent="";return;}try{$("jsOut").textContent=JSON.stringify(JSON.parse(v),null,2);}catch(e){$("jsOut").textContent="invalid JSON: "+e.message;}};
  $("rgIn").oninput=()=>{const c=country($("rgIn").value.trim());$("rgOut").textContent=c?c+". This is the region code TikTok reports for the account. It is not proof of where the account was created.":"TikTok reports region as a two letter country code.";};
}
document.addEventListener("click",(e)=>{
  const f=e.target.closest("[data-fav]");
  if(f){e.preventDefault();showTab("lookup");setCompare(false);$("u").value=f.dataset.fav;run(f.dataset.fav,"");return;}
  const rm=e.target.closest("[data-rm]"),rn=e.target.closest("[data-ren]");
  if(rm){const fs=getFavs();fs.splice(+rm.dataset.rm,1);setFavs(fs);renderFavs();}
  if(rn){const fs=getFavs(),x=fs[+rn.dataset.ren],n=prompt("Rename favourite",x.label||x.u);if(n!==null){x.label=n.trim();setFavs(fs);renderFavs();}}
});
function addHistory(u,v){
  let hs=store.get("hist",[]).filter((x)=>!(x.u===u&&(x.v||"")===(v||"")));
  hs.unshift({u,v:v||"",t:Date.now()});store.set("hist",hs.slice(0,30));
}
function showTab(n){
  document.querySelectorAll(".page").forEach((p)=>p.classList.toggle("on",p.id==="pg-"+n));
  document.querySelectorAll(".nav").forEach((b)=>b.classList.toggle("on",b.dataset.tab===n));
  $("pageName").textContent="// "+n;
  if(n==="history")renderHistory();if(n==="settings")renderSettings();if(n==="favs")renderFavs();if(n==="tools")renderTools();if(n==="reports")renderReport();
  toggleMenu(false);window.scrollTo(0,0);
}
function toggleMenu(on){
  $("drawer").classList.toggle("on",on);$("scrim").classList.toggle("on",on);
  $("drawer").inert=!on;$("menuBtn").setAttribute("aria-expanded",on);
  if(on){const a=document.querySelector(".nav.on")||document.querySelector(".nav");a&&a.focus();}
}
document.addEventListener("keydown",(e)=>{if(e.key==="Escape"&&$("drawer").classList.contains("on")){toggleMenu(false);$("menuBtn").focus();}});
function renderHistory(){
  const hs=store.get("hist",[]);
  $("pg-history").innerHTML=box("history",'<label class="field" for="hq"><input id="hq" placeholder="search history" autocomplete="off" spellcheck="false"></label><div id="hlist" style="margin-top:10px"></div><div class="nt">Saved only on this device. Clearing your browser data will remove it.</div>')+(hs.length?'<div class="box"><button id="clrHist" type="button" class="ghost">clear all</button></div>':"");
  const draw=()=>{const f=$("hq").value.toLowerCase();
    $("hlist").innerHTML=hs.map((x,i)=>[x,i]).filter((a)=>(a[0].u+" "+a[0].v).toLowerCase().includes(f)).map((a)=>'<div class="row hrow" data-i="'+a[1]+'"><span class="k">@'+esc(a[0].u)+(a[0].v?" vs @"+esc(a[0].v):"")+'<br><span class="sm">'+esc(new Date(a[0].t).toLocaleString())+'</span></span><span class="v"><button type="button" class="ghost sbtn" data-del="'+a[1]+'" aria-label="delete this item">delete</button></span></div>').join("")||'<div class="empty">'+(hs.length?"no matches":"nothing here yet. run a lookup first.")+"</div>";};
  draw();$("hq").oninput=draw;
  if($("clrHist"))$("clrHist").onclick=()=>{store.set("hist",[]);renderHistory();};
}
function renderSettings(){
  const cur=store.get("theme","dark"),compact=store.get("compact",false);
  $("pg-settings").innerHTML=box("theme",'<div class="themes">'+THEMES.map((t)=>'<button type="button" class="th'+(t[0]===cur?" on":"")+'" data-th="'+t[0]+'"><i style="background:linear-gradient(135deg,'+t[2]+" 50%,"+t[3]+' 50%)"></i>'+t[1]+"</button>").join("")+"</div>")+
    box("display",'<div class="row"><span class="k">collapse detail boxes</span><button type="button" id="cmpTog" class="ghost" style="min-height:36px">'+(compact?"on":"off")+'</button></div><div class="row"><span class="k">date format</span><button type="button" id="dfBtn" class="ghost sbtn">'+store.get("df","long")+'</button></div><div class="row"><span class="k">reduce motion</span><button type="button" id="calmBtn" class="ghost sbtn">'+(store.get("calm",false)?"on":"off")+'</button></div><div class="nt">Hides identity, flags, settings, dates and avatars under one tap-to-open section.</div>')+
    box("data",'<button type="button" id="clrAll" class="ghost">clear search history</button>');
  document.querySelectorAll("[data-th]").forEach((b)=>b.onclick=()=>{applyTheme(b.dataset.th);renderSettings();});
  $("cmpTog").onclick=()=>{store.set("compact",!store.get("compact",false));renderSettings();};
  $("dfBtn").onclick=()=>{const o=["long","iso","us"],n=o[(o.indexOf(store.get("df","long"))+1)%3];store.set("df",n);renderSettings();};
  $("calmBtn").onclick=()=>{const n=!store.get("calm",false);store.set("calm",n);document.documentElement.dataset.calm=n?"1":"0";renderSettings();};
  $("clrAll").onclick=(e)=>{store.set("hist",[]);e.target.textContent="cleared";};
}
$("menuBtn").onclick=()=>toggleMenu(true);
$("scrim").onclick=()=>toggleMenu(false);
document.querySelectorAll(".nav").forEach((b)=>b.onclick=()=>showTab(b.dataset.tab));
document.addEventListener("click",(e)=>{
  const dl=e.target.closest("[data-del]");
  if(dl){const hs=store.get("hist",[]);hs.splice(+dl.dataset.del,1);store.set("hist",hs);renderHistory();return;}
  const r=e.target.closest(".hrow");if(!r||r.dataset.i==null)return;
  const x=store.get("hist",[])[+r.dataset.i];if(!x)return;
  showTab("lookup");$("u").value=x.u;
  if(x.v){setCompare(true);$("v").value=x.v;}else setCompare(false);
  run(x.u,x.v);
});
(function(){
  const q=new URLSearchParams(location.search),u=clean(q.get("u")),v=clean(q.get("v"));
  if(u&&valid(u)){$("u").value=u;if(v&&valid(v)){setCompare(true);$("v").value=v;}run(u,v&&valid(v)?v:"");}
})();
</script>
</body>
</html>
